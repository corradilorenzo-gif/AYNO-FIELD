name: CicloVivo - build APK
on:
  push:
    branches: [ciclovivo-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract CicloVivo source
        run: |
          mkdir -p CicloVivo
          cat CicloVivo/.build/part*.txt | base64 -d > /tmp/ciclovivo-source.tar.xz
          echo "2ca0fef4a82d8fdcc7dd131a5387f74842102056e8795d31a8c3c26594f89983  /tmp/ciclovivo-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ciclovivo-source.tar.xz -C CicloVivo
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDKMANAGER" || { echo "sdkmanager non trovato"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Configure stable SDK API level
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/;s/targetSdk = 37/targetSdk = 36/' CicloVivo/app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.10.01/' CicloVivo/app/build.gradle.kts
      - name: Compile CicloVivo
        run: gradle -p CicloVivo :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CicloVivo-0.2-debug-APK
          path: CicloVivo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
