name: CicloVivo 0.4.1 - correzioni e firma stabile
on:
  push:
    branches: [ciclovivo-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified CicloVivo 0.3 source
        run: |
          mkdir -p CicloVivo
          cat CicloVivo/.build/part*.txt | base64 -d > /tmp/ciclovivo-source.tar.xz
          echo "0adeb099cfb774b5b99d505bcd02883cd19f96a4bde4500dbecd34f281902841  /tmp/ciclovivo-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ciclovivo-source.tar.xz -C CicloVivo
      - name: Apply verified Gadgetbridge 0.4 patch
        run: |
          base64 -d CicloVivo/.build/gadgetbridge-v04.patch.b64 > /tmp/gadgetbridge-v04.patch.xz
          echo "1f388b21a52a8695356e54e50fe9a771f7787c13a24277b7a79602f8f7fc5936  /tmp/gadgetbridge-v04.patch.xz" | sha256sum -c -
          xz -dc /tmp/gadgetbridge-v04.patch.xz | (cd CicloVivo && patch --batch --fuzz=0 -p1)
          test -f CicloVivo/app/src/main/java/it/ciclovivo/app/GadgetbridgeConnector.kt
      - name: Apply verified CicloVivo 0.4.1 fixes
        run: |
          base64 -d CicloVivo/.build/upgrade041.py.xz.b64 > /tmp/cv041.py.xz
          echo "66bc907f2ba14227f8614098f04ac84db2382bf4d58cbf967a174f48fe9e8ec1  /tmp/cv041.py.xz" | sha256sum -c -
          xz -dc /tmp/cv041.py.xz > /tmp/cv041.py
          python3 /tmp/cv041.py
          grep -q 'versionName = "0.4.1"' CicloVivo/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Ensure actual tests are present
        run: |
          test -f CicloVivo/app/src/test/java/it/ciclovivo/app/CycleCalculatorTest.kt
          test -f CicloVivo/app/src/test/java/it/ciclovivo/app/BackupCryptoTest.kt
          test -f CicloVivo/app/src/test/java/it/ciclovivo/app/WearableImportTest.kt
      - name: Unit tests and APK
        run: gradle -p CicloVivo :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Verify unit tests actually ran
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          files=glob.glob('CicloVivo/app/build/test-results/testDebugUnitTest/*.xml')
          assert files,'Nessun rapporto JUnit trovato'
          tests=sum(int(ET.parse(f).getroot().attrib.get('tests',0)) for f in files)
          failed=sum(int(ET.parse(f).getroot().attrib.get('failures',0))+int(ET.parse(f).getroot().attrib.get('errors',0)) for f in files)
          assert tests>=27 and failed==0,f'Test insufficienti o falliti: {tests}, {failed}'
          print(f'{tests} test JUnit eseguiti; {failed} falliti')
          PY
      - name: Publish APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CicloVivo-0.4.1-debug-APK
          path: CicloVivo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish unsigned release for offline stable signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CicloVivo-0.4.1-unsigned-release
          path: CicloVivo/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Publish Android apksigner tool
        if: success()
        run: |
          JAR=$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          test -s "$JAR"
          cp "$JAR" /tmp/ciclovivo-apksigner.jar
      - name: Upload apksigner jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ciclovivo-apksigner-tool
          path: /tmp/ciclovivo-apksigner.jar
          if-no-files-found: error
