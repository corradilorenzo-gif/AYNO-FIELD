name: CicloVivo 0.4.4 - calendario automatico
on:
  push:
    branches: [ciclovivo-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified CicloVivo 0.4.3 source
        run: |
          mkdir -p CicloVivo
          base64 -d CicloVivo/.build/source043.b64 > /tmp/ciclovivo-source.tar.xz
          echo "3f93a292c5f58d33ab20d0178af7c13d00008944f9dfbe7ee428c89e407a5667  /tmp/ciclovivo-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ciclovivo-source.tar.xz -C CicloVivo
          grep -q 'versionName = "0.4.3"' CicloVivo/app/build.gradle.kts
          test -f CicloVivo/app/src/main/res/drawable-nodpi/ciclovivo_launcher_art.png
          test -f CicloVivo/app/src/main/java/it/ciclovivo/app/CalendarBridge.kt
      - name: Apply verified CicloVivo 0.4.4 changes
        run: |
          base64 -d CicloVivo/.build/upgrade044.patch.xz.b64 > /tmp/upgrade044.patch.xz
          echo "eb9ceca31d3de5a8f04432a8bee3458f013a11cbb898583717c0eb2b51c80810  /tmp/upgrade044.patch.xz" | sha256sum -c -
          xz -dc /tmp/upgrade044.patch.xz | (cd CicloVivo && patch --batch --fuzz=0 -p2)
          grep -q 'versionName = "0.4.4"' CicloVivo/app/build.gradle.kts
          test -f CicloVivo/app/src/test/java/it/ciclovivo/app/CalendarSyncPlannerTest.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build and run unit tests
        run: gradle -p CicloVivo :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Confirm unit tests actually ran
        run: |
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          files=glob.glob('CicloVivo/app/build/test-results/testDebugUnitTest/*.xml')
          assert files,'Mancano risultati JUnit'
          tests=sum(int(ET.parse(f).getroot().attrib.get('tests',0)) for f in files)
          errors=sum(int(ET.parse(f).getroot().attrib.get('errors',0))+int(ET.parse(f).getroot().attrib.get('failures',0)) for f in files)
          print(f'{tests} test eseguiti, {errors} errori')
          assert tests>=34 and errors==0
          PY
      - name: Upload unsigned release for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: CicloVivo-0.4.4-unsigned-release
          path: CicloVivo/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
