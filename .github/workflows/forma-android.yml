name: Forma Android APK 0.2.1

on:
  push:
    branches: [forma-android-build]
    paths:
      - 'FormaAndroid/source.part*'
      - 'FormaAndroid/v02/payload.part*'
      - '.github/workflows/forma-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Forma 0.2 and apply 0.2.1 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/forma-env
          /tmp/forma-env/bin/pip install Brotli==1.1.0
          cat FormaAndroid/v02/payload.part{01,02,03,04,05,06,07,08} | base64 --decode > /tmp/forma.br
          echo '1f3eb5e9045fbf06a665683ab061d7e1e0ffbd3a6f81488139665bfd001a8c8f  /tmp/forma.br' | sha256sum -c -
          /tmp/forma-env/bin/python -c "import brotli,pathlib;pathlib.Path('/tmp/forma.tar').write_bytes(brotli.decompress(pathlib.Path('/tmp/forma.br').read_bytes()))"
          tar -xf /tmp/forma.tar -C FormaAndroid
          python3 FormaAndroid/v021/fix_profile.py
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK without legacy tools package
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile and test APK
        working-directory: FormaAndroid
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Forma APK
        uses: actions/upload-artifact@v4
        with:
          name: Forma-Android-0.2.1-debug
          path: FormaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
