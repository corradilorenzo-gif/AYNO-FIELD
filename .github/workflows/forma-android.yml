name: Forma Android APK 0.5.0

on:
  push:
    branches: [forma-android-build]
    paths:
      - 'FormaAndroid/source.part*'
      - 'FormaAndroid/v02/payload.part*'
      - 'FormaAndroid/v03/payload.part*'
      - 'FormaAndroid/v04/*'
      - 'FormaAndroid/v041/*'
      - 'FormaAndroid/v05/*'
      - '.github/workflows/forma-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore Forma 0.4 preserving saved diary data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/forma-env
          /tmp/forma-env/bin/pip install Brotli==1.1.0
          cat FormaAndroid/v02/payload.part{01,02,03,04,05,06,07,08} | base64 --decode > /tmp/forma.br
          echo '1f3eb5e9045fbf06a665683ab061d7e1e0ffbd3a6f81488139665bfd001a8c8f  /tmp/forma.br' | sha256sum -c -
          /tmp/forma-env/bin/python -c "import brotli,pathlib;pathlib.Path('/tmp/forma.tar').write_bytes(brotli.decompress(pathlib.Path('/tmp/forma.br').read_bytes()))"
          tar -xf /tmp/forma.tar -C FormaAndroid
          python3 FormaAndroid/v021/fix_profile.py
          cat FormaAndroid/v03/payload.part{01,02,03,04,05} | base64 --decode > /tmp/forma-v03.br
          echo '21a28299a18334b1794014ea5047106734265d6979eaa385b5c3abf8757f1e16  /tmp/forma-v03.br' | sha256sum -c -
          /tmp/forma-env/bin/python -c "import brotli,pathlib;pathlib.Path('/tmp/forma-v03.tar').write_bytes(brotli.decompress(pathlib.Path('/tmp/forma-v03.br').read_bytes()))"
          tar -xf /tmp/forma-v03.tar -C FormaAndroid
          grep -q 'versionName = "0.3.0"' FormaAndroid/app/build.gradle.kts
          base64 --decode FormaAndroid/v04/update_diary_first.br.b64 > /tmp/forma-v04.br
          echo '41c120218f8d6bceff89628c1e471c7021ea6607945bcbe2d9086c26e95db95d  /tmp/forma-v04.br' | sha256sum -c -
          /tmp/forma-env/bin/python -c "import brotli,pathlib;pathlib.Path('update_diary_first.py').write_bytes(brotli.decompress(pathlib.Path('/tmp/forma-v04.br').read_bytes()))"
          python3 update_diary_first.py
          grep -q 'versionName = "0.4.0"' FormaAndroid/app/build.gradle.kts
          python3 FormaAndroid/v041/add_protein_table.py
          grep -q 'versionName = "0.4.1"' FormaAndroid/app/build.gradle.kts
          ! grep -q 'Registra proposta del menù' FormaAndroid/app/src/main/java/it/forma/app/ui/FoodEnergySection.kt
          cat FormaAndroid/v05/patch.part{01,02,03} | base64 --decode > /tmp/forma-v05.br
          echo '26ba79be717d0d5719f948b78b6a3e70e9a72f82be93399d6a7793e3f6d5577e  /tmp/forma-v05.br' | sha256sum -c -
          /tmp/forma-env/bin/python -c "import brotli,pathlib;pathlib.Path('/tmp/forma-v05.tar').write_bytes(brotli.decompress(pathlib.Path('/tmp/forma-v05.br').read_bytes()))"
          tar -xf /tmp/forma-v05.tar -C FormaAndroid
          sed -i 's/0.4.1 · Diario libero e fonti proteiche/0.4.1 · Tabella fonti proteiche/' FormaAndroid/app/src/main/java/it/forma/app/ui/FormaScreens.kt
          (cd FormaAndroid && patch -p1 --batch -i patch.diff)
          grep -q 'versionName = "0.5.0"' FormaAndroid/app/build.gradle.kts
          grep -q 'I miei allenamenti' FormaAndroid/app/src/main/java/it/forma/app/ui/WorkoutDiarySection.kt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK without legacy tools package
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Setup Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile and test APK
        working-directory: FormaAndroid
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload Forma APK
        uses: actions/upload-artifact@v4
        with:
          name: Forma-Android-0.5.0-debug
          path: FormaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
